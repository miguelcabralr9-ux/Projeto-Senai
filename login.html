<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LH Games - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html"><img src="img/logo.png" alt="LH Games"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html#promocoes">Promoções</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#section-vendidos">Console</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#novidades">Jogos</a></li>
                        <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="section-login">
            <h1>Login</h1>
            <div class="d-flex justify-content-center">
                <form id="login-form">
                    <p>
                        <label for="usuario">Nome:</label>
                        <input id="usuario" name="usuario" required type="text" placeholder="Insira o seu usuário" class="form-control">
                    </p>
                    <p>
                        <label for="senha">Senha:</label>
                        <input id="senha" name="senha" required type="password" placeholder="Insira a sua senha" class="form-control">
                    </p>
                    <p>
                        <input type="button" value="Login" class="btn btn-primary" id="bt-login" onclick="login()">
                    </p>
                </form>
            </div>
        </section>

        <section id="section-cadastro">
            <div id="botao-cadastrar">
                <button type="button" class="btn btn-info">Não é cadastrado ainda? Cadastre-se</button>
            </div>

            <div id="form-cadastrar">
                <h1>Criar minha conta</h1>
                <p>Informe os seus dados abaixo para criar sua conta.</p>
                <div class="d-flex justify-content-center">
                    <form id="cadastro-form">
                        <p>
                            <label for="cadastro-usuario">Usuário:</label>
                            <input id="cadastro-usuario" name="cadastro-usuario" required type="text" placeholder="ex. nome de usuário" class="form-control">
                        </p>
                        <p>
                            <label for="email">E-mail:</label>
                            <input id="email" name="email" required type="email" placeholder="seu@email.com.br" class="form-control">
                        </p>
                        <p>
                            <label for="cadastro-senha">Senha:</label>
                            <input id="cadastro-senha" name="cadastro-senha" required type="password" placeholder="mínimo de 6 caracteres" class="form-control">
                        </p>
                        <p>
                            <input type="button" value="Cadastrar" class="btn btn-primary" id="bt-cadastrar" onclick="cadastro()">
                        </p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>LH Games - Loja de eletrônicos gamer</p>
        <p>Todos os direitos reservados</p>
    </footer>

    <button id="voltar-topo" type="button" class="btn btn-outline-primary" onclick="topo()">&uarr; Voltar ao topo</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.1.js"></script>
    <script src="js/jquery-script.js"></script>
</body>
</html>
