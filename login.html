<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LH Games - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                <img src="img/logo.png">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Promoções</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Console</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Jogos</a>
                    </li>

                </ul>

                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="O que deseja buscar?">
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>

            </div>
        </div>
    </nav>
</header>

<main>

    <section id="section-login" class="container">

        <h1>LOGIN</h1>

        <label for="usuario">Usuário</label>
        <input type="text" name="usuario" id="usuario" class="form-control">

        <label for="senha">Senha</label>
        <input type="password" id="senha" class="form-control">

        <br>

        <input type="button" value="login" class="btn btn-primary" id="bt-login" onclick="login()">

        <br><br>

        <div id="section-cadastro">
            <p>Não é cadastrado ainda?</p>

            <div id="botao-cadastrar">
                <button type="button" class="btn btn-info">
                    Cadastre-se
                </button>
            </div>
        </div>

    </section>

    <section id="form-cadastrar" class="container">

        <h1>CADASTRO</h1>

        <label for="nome">Nome</label>
        <input type="text" id="nome" class="form-control">

        <label for="email">E-mail</label>
        <input type="email" id="email" class="form-control">

        <label for="nova-senha">Senha</label>
        <input type="password" id="nova-senha" class="form-control">

        <br>

        <input type="button" value="Cadastrar" class="btn btn-primary" id="bt-cadastrar" onclick="cadastro()">

    </section>

</main>

<footer>
    <p>Desenvolvido por LH Games</p>
</footer>

<button id="voltar-topo" type="button" class="btn btn-outline-primary" onclick="topo()">
    &uarr; Voltar ao topo
</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="https://code.jquery.com/jquery-3.6.1.js"></script>
<script type="text/javascript" src="js/jquery-script.js"></script>

</body>
</html>
